name: 每日定時更新財經新聞

on:
  schedule:
    # 這裡代表每小時的 0 分會自動執行 (UTC 時間)
    - cron: '0 * * * *'
  workflow_dispatch: # 允許您在 GitHub 網頁上手動點擊按鈕立即更新

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 複製儲存庫檔案
      uses: actions/checkout@v4 # 升級到 v4，解決 Node 20 棄用警告

    - name: 設定 Python 環境
      uses: actions/setup-python@v5 # 升級到 v5
      with:
        python-version: '3.10' # 修正：這裡已改為正確的 python-version

    - name: 安裝必要的套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行爬蟲腳本並生成新網頁
      run: python fetch_news.py

    - name: 將變更自動推回 GitHub 儲存庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html
        git commit -m "自動更新新聞: $(date)" || echo "沒有新內容需要更新"
        git push
